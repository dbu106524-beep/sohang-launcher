name: Build macOS Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter minecraft-launcher-lib requests pillow

      - name: Create macOS icon
        run: |
          mkdir -p build/icon.iconset
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          candidates = [
              Path("sohangicon-transparent.png"),
              Path("sohangicon.png"),
              Path("sohangicon.ico"),
          ]
          source = None
          image = None

          for candidate in candidates:
              if not candidate.exists():
                  continue
              try:
                  image = Image.open(candidate).convert("RGBA")
                  image.load()
                  source = candidate
                  break
              except Exception as exc:
                  print(f"Skipping invalid icon {candidate}: {exc}")

          if image is None:
              print("No valid icon image found. Creating fallback icon.")
              image = Image.new("RGBA", (1024, 1024), (10, 10, 26, 255))
              draw = ImageDraw.Draw(image)
              draw.ellipse((162, 260, 862, 760), fill=(244, 198, 210, 255))
              draw.ellipse((80, 390, 944, 650), outline=(124, 58, 237, 255), width=54)
          else:
              print(f"Using icon source: {source}")

          sizes = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
              "icon_512x512@2x.png": 1024,
          }
          output_dir = Path("build/icon.iconset")
          for filename, size in sizes.items():
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(output_dir / filename)
          PY
          iconutil -c icns build/icon.iconset -o sohangicon.icns

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name SohangLauncher \
            --icon sohangicon.icns \
            --add-data "sohangicon-transparent.png:." \
            --add-data "sohangicon.ico:." \
            launcher.py

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent SohangLauncher.app SohangLauncher-mac-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SohangLauncher-mac-${{ matrix.arch }}
          path: dist/SohangLauncher-mac-${{ matrix.arch }}.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SohangLauncher-mac-${{ matrix.arch }}.zip
