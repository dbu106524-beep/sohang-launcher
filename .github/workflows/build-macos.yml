name: Build macOS Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter minecraft-launcher-lib requests

      - name: Create macOS icon
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16 sohangicon-transparent.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 sohangicon-transparent.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 sohangicon-transparent.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 sohangicon-transparent.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 sohangicon-transparent.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 sohangicon-transparent.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 sohangicon-transparent.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 sohangicon-transparent.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 sohangicon-transparent.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 sohangicon-transparent.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o sohangicon.icns

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name SohangLauncher \
            --icon sohangicon.icns \
            --add-data "sohangicon-transparent.png:." \
            --add-data "sohangicon.ico:." \
            launcher.py

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent SohangLauncher.app SohangLauncher-mac-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SohangLauncher-mac-${{ matrix.arch }}
          path: dist/SohangLauncher-mac-${{ matrix.arch }}.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SohangLauncher-mac-${{ matrix.arch }}.zip
